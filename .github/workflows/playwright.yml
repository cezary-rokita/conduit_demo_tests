name: Playwright Tests
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Start Practice Software Testing (SUT)
        run: |
          git clone --depth 1 https://github.com/testsmith-io/practice-software-testing.git /tmp/pst
          cd /tmp/pst
          docker compose up -d --build
          
          # Wait for the composer container to finish installing PHP packages and exit
          docker wait pst-composer-1
          
          # Wait for UI and API web server to come online
          npx wait-on http://localhost:8091/status http://localhost:4200 -t 180000
          
          # Run your exact command (without -t since CI has no TTY)
          docker exec -i pst-laravel-api-1 php artisan migrate:fresh --seed

      - name: Run Playwright tests
        run: npx playwright test
        env:
          BASE_URL: http://localhost:4200
          API_URL: http://localhost:8091
          STORAGE_STATE: .auth/customer.json
          TEST_USER_EMAIL: customer@practicesoftwaretesting.com
          TEST_USER_PASSWORD: welcome01

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
